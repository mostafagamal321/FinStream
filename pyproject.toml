[project]
name = "finstream"
version = "0.1.0"
description = "Real-Time Financial Intelligence Platform"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "numpy",
  "confluent-kafka",
  "fastavro",
  "redis",
  "requests",
  "scikit-learn",
  "xgboost",
  "mlflow",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
